<!DOCTYPE html>
<html lan="en">



<head>
    <meta charset="UTF-8" />


    <title>HTML5</title>

</head>



<style>
    body {

        position: fixed;
        /* Фиксирует элемент относительно окна браузера */
        overflow: hidden;
        /* Скрывает полосы прокрутки, если контент не помещается */
        width: 100%;
        /* Растягивает элемент на всю ширину окна */
        height: 100%;
        /* Растягивает элемент на всю высоту окна */
    }

    .img_deg {

        float: left;

    }

    .pos_1 {
        position: absolute;

        top: 420px;
    }

    .pos_2 {
        position: absolute;

        top: 420px;
        left: 250px;
    }
</style>

<head>



</head>







<body>

    <div class="pos_1">

        <img class="img_deg" src="2.gif" id="imageUniqueID">


    </div>

    <div class="pos_2">

        <img class="img_deg" src="3.gif" id="imageUniqueID2">


    </div>



    <section>
        <div class="videoClass">
            <video loop="true" id="videoID" autoplay controls width="500" height="420">


                <source src="1.mp4" id="videoUniqueID">

            </video>

        </div>
    </section>

    <script src="mainVideo.js"></script>


</body>
